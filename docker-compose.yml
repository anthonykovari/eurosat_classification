services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: chicago-landuse-backend
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
    environment:
      - MODEL_PATH=/app/outputs/resnet18_eurosat.pth
      - SEG_MODEL_PATH=/app/outputs/segformer_b2_loveda.pth
      - S3_BUCKET=chicago-land-use
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      # Point at LocalStack for local dev; remove for real AWS
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: chicago-landuse-frontend
    ports:
      - "3000:8000"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    ports:
      - "5001:5000"
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri /mlruns
        --default-artifact-root /mlruns/artifacts
    volumes:
      - ./mlruns:/mlruns

  prometheus:
    image: prom/prometheus:v2.51.2
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'

  grafana:
    image: grafana/grafana:10.4.2
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mlflow-data:
  prometheus-data:
  grafana-data:

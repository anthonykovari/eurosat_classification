apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - minio.yaml
  - minio-secret.yaml

patches:
  - path: backend-service-patch.yaml
  - path: frontend-service-patch.yaml
  - path: backend-model-patch.yaml
  - path: frontend-image-patch.yaml

images:
  - name: eurosat-backend
    newName: eurosat-backend
    newTag: latest
  - name: eurosat-frontend
    newName: eurosat-frontend
    newTag: latest

configMapGenerator:
  - name: eurosat-config
    behavior: merge
    literals:
      - DEBUG=true
      - S3_BUCKET=chicago-land-use
      - AWS_ENDPOINT_URL=http://minio:9000
      - AWS_DEFAULT_REGION=us-east-1

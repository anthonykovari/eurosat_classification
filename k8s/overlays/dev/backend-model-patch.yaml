# Replaces the S3 init container with a minikube hostPath volume.
# make k8s-minikube-deploy copies the model into the node via minikube cp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: eurosat
spec:
  template:
    spec:
      initContainers:
        - name: download-model
          $patch: delete
      volumes:
        - $patch: replace
        - name: model-store
          hostPath:
            path: /mnt/eurosat-outputs
            type: Directory
        - name: uploads
          emptyDir: {}
      containers:
        - name: backend
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: eurosat-config
            - secretRef:
                name: minio-credentials
